<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SDGs Storytelling Journey — ภาพรวมระบบ</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&family=Prompt:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    body{background:var(--kku-light);}
    .ov-header{background:linear-gradient(135deg,var(--kku-navy) 0%,#0f3460 60%,#16213e 100%);padding:40px 0 48px;position:relative;overflow:hidden;}
    .ov-header::before{content:'';position:absolute;top:-80px;right:-80px;width:360px;height:360px;border-radius:50%;background:rgba(200,146,42,0.1);}
    .ov-header::after{content:'';position:absolute;bottom:-100px;left:5%;width:280px;height:280px;border-radius:50%;background:rgba(13,122,110,0.12);}
    .ov-header-inner{max-width:1040px;margin:0 auto;padding:0 24px;position:relative;z-index:1;text-align:center;}
    .ov-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);padding:6px 16px;border-radius:30px;font-size:12px;font-weight:600;color:#f0c76a;margin-bottom:18px;}
    .ov-badge .dot{width:8px;height:8px;border-radius:50%;background:#f0c76a;}
    .ov-title{font-family:'Prompt',sans-serif;font-size:34px;font-weight:800;color:#fff;margin-bottom:8px;line-height:1.2;}
    .ov-title span{color:#f0c76a;}
    .ov-subtitle{font-size:15px;color:rgba(255,255,255,0.75);max-width:600px;margin:0 auto 26px;line-height:1.6;}
    .ov-cta{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--kku-teal),#0a5c52);color:#fff;padding:14px 32px;border-radius:12px;font-family:'Sarabun',sans-serif;font-size:15px;font-weight:700;text-decoration:none;transition:all 0.2s;box-shadow:0 6px 20px rgba(13,122,110,0.4);border:none;cursor:pointer;}
    .ov-cta:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(13,122,110,0.5);}

    .ov-main{max-width:1040px;margin:-28px auto 0;padding:0 24px 60px;position:relative;z-index:2;}

    /* Big stat cards */
    .ov-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px;}
    .ov-stat{background:#fff;border-radius:16px;padding:26px 20px;text-align:center;border:1px solid var(--kku-border);box-shadow:0 4px 16px rgba(26,43,94,0.06);}
    .ov-stat-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;}
    .ov-stat-val{font-family:'Prompt',sans-serif;font-size:38px;font-weight:800;color:var(--kku-navy);line-height:1;}
    .ov-stat-lbl{font-size:13px;color:var(--kku-gray);margin-top:6px;font-weight:500;}

    /* Panels */
    .ov-panel{background:#fff;border-radius:16px;padding:24px;border:1px solid var(--kku-border);box-shadow:0 4px 16px rgba(26,43,94,0.06);margin-bottom:20px;}
    .ov-panel h2{font-family:'Prompt',sans-serif;font-size:17px;font-weight:700;color:var(--kku-navy);margin-bottom:18px;display:flex;align-items:center;gap:8px;}

    /* SDG bar chart */
    .sdg-chart{display:flex;flex-direction:column;gap:8px;}
    .sdg-bar-row{display:flex;align-items:center;gap:10px;}
    .sdg-bar-label{width:32px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;}
    .sdg-bar-track{flex:1;height:22px;background:#f0f3f8;border-radius:11px;overflow:hidden;position:relative;}
    .sdg-bar-fill{height:100%;border-radius:11px;transition:width 0.8s ease;min-width:2px;}
    .sdg-bar-count{width:32px;text-align:right;font-family:'Prompt',sans-serif;font-weight:700;color:var(--kku-navy);font-size:14px;flex-shrink:0;}

    /* Unit list */
    .unit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;}
    .unit-item{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--kku-light);border-radius:10px;border:1px solid var(--kku-border);}
    .unit-name{font-size:13px;color:#333;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .unit-count{font-family:'Prompt',sans-serif;font-weight:800;color:var(--kku-teal);font-size:16px;margin-left:10px;flex-shrink:0;}

    .ov-loading{text-align:center;padding:50px;color:var(--kku-gray);font-size:15px;}
    .ov-footer{text-align:center;padding:24px;font-size:12px;color:var(--kku-gray);}

    @media(max-width:720px){
      .ov-stats{grid-template-columns:1fr;}
      .ov-title{font-size:26px;}
      .unit-grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>

<div class="ov-header">
  <div class="ov-header-inner">
    <div class="ov-badge"><span class="dot"></span> KKU SDGs — Khon Kaen University</div>
    <h1 class="ov-title">🌍 SDGs Storytelling Journey</h1>
    <p class="ov-subtitle">ระบบจัดเก็บเรื่องราวโครงการเพื่อการพัฒนาที่ยั่งยืน มหาวิทยาลัยขอนแก่น — ภาพรวมความก้าวหน้าของทุกหน่วยงาน</p>
    <a href="login.html" class="ov-cta">🔍 เข้าดูโครงการทั้งหมด</a>
  </div>
</div>

<div class="ov-main">
  <div id="ovContent">
    <div class="ov-loading">⏳ กำลังโหลดข้อมูลภาพรวม...</div>
  </div>
</div>

<div class="ov-footer">
  มหาวิทยาลัยขอนแก่น — <a href="https://sdg.kku.ac.th" style="color:var(--kku-teal)">sdg.kku.ac.th</a>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz3GW1VJu64Km4n9rypJGkpVUV67hJTUNVjgd6P4mC_xLfkzTocqQq1fVTcHf-sWgGz/exec';

const sdgColors = {1:'#e5243b',2:'#dda63a',3:'#4c9f38',4:'#c5192d',5:'#ff3a21',6:'#26bde2',
  7:'#fcc30b',8:'#a21942',9:'#fd6925',10:'#dd1367',11:'#fd9d24',12:'#bf8b2e',
  13:'#3f7e44',14:'#0a97d9',15:'#56c02b',16:'#00689d',17:'#19486a'};
const sdgNames = {1:'ขจัดความยากจน',2:'ขจัดความหิวโหย',3:'สุขภาพที่ดี',4:'การศึกษา',5:'ความเท่าเทียมเพศ',6:'น้ำสะอาด',7:'พลังงานสะอาด',8:'งานที่มีคุณค่า',9:'นวัตกรรม',10:'ลดความเหลื่อมล้ำ',11:'เมืองยั่งยืน',12:'การผลิตยั่งยืน',13:'สภาพภูมิอากาศ',14:'ทรัพยากรทะเล',15:'ระบบนิเวศบนบก',16:'สันติภาพ',17:'ความร่วมมือ'};

// ── ยิง API แบบลองซ้ำอัตโนมัติ (กัน cold start / โหลดครั้งแรกไม่ทัน) ──
async function fetchJSONRetry(url, options, onAttempt) {
  const maxTries = 2;
  let lastErr;
  for (let attempt = 1; attempt <= maxTries; attempt++) {
    if (onAttempt) onAttempt(attempt, maxTries);
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 90000);
      // กันแคช: เติมตัวเลขเวลาท้าย URL + no-store เพื่อไม่ให้เบราว์เซอร์ส่งคำตอบเก่า
      const bustedUrl = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_ts=' + Date.now();
      const res = await fetch(bustedUrl, Object.assign({ signal: controller.signal, cache: 'no-store' }, options || {}));
      clearTimeout(timer);
      const text = await res.text();
      const trimmed = (text || '').trim();
      if (trimmed.startsWith('<')) throw new Error('ระบบยังตอบไม่พร้อม (HTML)');
      return JSON.parse(trimmed);
    } catch (e) {
      lastErr = e;
      if (attempt < maxTries) await new Promise(r => setTimeout(r, 4000));
    }
  }
  throw lastErr;
}

async function loadStats() {
  try {
    const d = await fetchJSONRetry(API_URL + '?action=getStats', null, function(attempt) {
      const msg = attempt === 1 ? '⏳ กำลังโหลดข้อมูล... อาจใช้เวลาสักครู่ (สูงสุด ~1 นาที) กรุณาอย่าเพิ่งปิดหน้านี้' : '⏳ กำลังโหลดข้อมูล... (ลองอีกครั้ง ' + attempt + ')';
      document.getElementById('ovContent').innerHTML = '<div class="ov-loading">' + msg + '</div>';
    });
    if (d.status !== 'success') {
      document.getElementById('ovContent').innerHTML = '<div class="ov-loading">❌ โหลดข้อมูลไม่สำเร็จ <button onclick="loadStats()" style="margin-left:8px;padding:6px 14px;border:1px solid var(--kku-border);border-radius:8px;background:#fff;cursor:pointer;font-family:Sarabun,sans-serif;">🔄 ลองใหม่</button></div>';
      return;
    }
    renderStats(d);
  } catch (e) {
    document.getElementById('ovContent').innerHTML = '<div class="ov-loading">❌ โหลดข้อมูลไม่สำเร็จ — ระบบอาจกำลังตื่น <button onclick="loadStats()" style="margin-left:8px;padding:6px 14px;border:1px solid var(--kku-border);border-radius:8px;background:#fff;cursor:pointer;font-family:Sarabun,sans-serif;">🔄 ลองใหม่</button></div>';
  }
}

function renderStats(d) {
  let html = '';

  // 3 big stats
  html += '<div class="ov-stats">';
  html += '<div class="ov-stat"><div class="ov-stat-icon" style="background:rgba(13,122,110,0.1);">📊</div><div class="ov-stat-val">' + d.total + '</div><div class="ov-stat-lbl">โครงการทั้งหมด</div></div>';
  html += '<div class="ov-stat"><div class="ov-stat-icon" style="background:rgba(200,146,42,0.12);">🏫</div><div class="ov-stat-val">' + d.units + '</div><div class="ov-stat-lbl">หน่วยงาน/คณะ ที่เข้าร่วม</div></div>';
  html += '<div class="ov-stat"><div class="ov-stat-icon" style="background:rgba(41,128,185,0.1);">🌐</div><div class="ov-stat-val">' + d.sdgCovered + '</div><div class="ov-stat-lbl">SDGs ที่ครอบคลุม (จาก 17)</div></div>';
  html += '</div>';

  // SDG chart
  html += '<div class="ov-panel"><h2>📈 จำนวนโครงการแยกตามเป้าหมาย SDGs</h2><div class="sdg-chart">';
  const maxSdg = Math.max(...Object.values(d.sdgCounts), 1);
  for (let i = 1; i <= 17; i++) {
    const c = d.sdgCounts[i] || 0;
    const pct = (c / maxSdg * 100).toFixed(1);
    const txtColor = (i===7||i===11) ? '#333' : '#fff';
    html += '<div class="sdg-bar-row">' +
      '<div class="sdg-bar-label" style="background:' + sdgColors[i] + ';color:' + txtColor + '">' + i + '</div>' +
      '<div style="width:130px;font-size:11px;color:#6b7c93;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + sdgNames[i] + '</div>' +
      '<div class="sdg-bar-track"><div class="sdg-bar-fill" style="width:' + pct + '%;background:' + sdgColors[i] + '"></div></div>' +
      '<div class="sdg-bar-count">' + c + '</div></div>';
  }
  html += '</div></div>';

  // Unit counts
  const units = Object.entries(d.unitCounts).sort((a,b) => b[1]-a[1]);
  if (units.length > 0) {
    html += '<div class="ov-panel"><h2>🏫 จำนวนโครงการแยกตามหน่วยงาน/คณะ</h2><div class="unit-grid">';
    units.forEach(([name, count]) => {
      html += '<div class="unit-item"><div class="unit-name">' + name + '</div><div class="unit-count">' + count + '</div></div>';
    });
    html += '</div></div>';
  }

  document.getElementById('ovContent').innerHTML = html;
}

loadStats();
</script>
</body>
</html>
